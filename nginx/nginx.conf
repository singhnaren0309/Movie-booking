worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ==========================================
    # 1. Upstream Clusters
    # ==========================================
    upstream movie_booking_backend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream ai_service_backend {
        server 127.0.0.1:3002;
        keepalive 16;
    }

    upstream notification_backend {
        server 127.0.0.1:3001;
        keepalive 8;
    }

    # ==========================================
    # 2. Rate Limiting Zones
    # ==========================================
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ==========================================
    # 3. Server Configuration (Port 80)
    # ==========================================
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Core Movie Booking - Auth (rate limited)
        location ~* ^/mba/api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://movie_booking_backend;
        }

        # Core Movie Booking - Main API
        location /mba/api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://movie_booking_backend;
        }

        # AI Assistant (Extended timeout for Groq tool execution)
        location /api/v1/chat {
            proxy_read_timeout 180s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_buffering off;
            proxy_pass http://ai_service_backend;
        }

        # Notification Worker Health Check
        location /health/notifications {
            proxy_pass http://notification_backend/;
        }
    }
}
